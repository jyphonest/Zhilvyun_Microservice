spring:
  application:
    name: zly-user-service

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848   # Nacos 服务注册中心（容器名）
      config:
        server-addr: localhost:8848   # Nacos 配置中心（容器名）
        file-extension: yaml
        shared-configs:
          - data-id: common-config.yaml
            refresh: true
