spring:
  application:
    name: zly-xxl-job #应用唯一标识,对应Nacos中的DataId
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848 #Nacos服务注册中心地址
      config:
        server-addr: localhost:8848 #Nacos作为配置中心地址
        file-extension: yaml #指定yaml格式的配置
        shared-configs:
          - data-id: common-config.yaml
            refresh: true